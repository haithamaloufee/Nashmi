name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-at-least-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017/nashmi_ci
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3006
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:security
      - run: npm run test:news
      - run: npm run test:concurrency
      - run: npm run test:storage
      - run: npm run test:migration
      - run: npm run build
      - run: npm run bundle:check
      - name: Optional authenticated E2E (trusted master pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_CITIZEN_EMAIL: ${{ secrets.E2E_CITIZEN_EMAIL }}
          E2E_CITIZEN_PASSWORD: ${{ secrets.E2E_CITIZEN_PASSWORD }}
          E2E_PARTY_EMAIL: ${{ secrets.E2E_PARTY_EMAIL }}
          E2E_PARTY_PASSWORD: ${{ secrets.E2E_PARTY_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          if [ -z "$E2E_BASE_URL" ] || ! { [ -n "$E2E_CITIZEN_EMAIL" ] && [ -n "$E2E_CITIZEN_PASSWORD" ] || [ -n "$E2E_PARTY_EMAIL" ] && [ -n "$E2E_PARTY_PASSWORD" ] || [ -n "$E2E_ADMIN_EMAIL" ] && [ -n "$E2E_ADMIN_PASSWORD" ]; }; then
            echo "Authenticated E2E skipped: no complete role credential pair is configured."
            exit 0
          fi
          npm run test:e2e:auth
